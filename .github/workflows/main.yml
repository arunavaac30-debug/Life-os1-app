
name: Build LIFE OS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/

      - name: Configure Capacitor
        run: |
          cat > package.json <<'EOF'
          {
            "name": "life-os-android",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.arunava.lifeos",
            "appName": "LIFE OS",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-OS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
